<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avalie seu iPhone | Lustoza Store</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b0b0d;--card:#16161a;--line:#2a2a31;--tx:#f4f4f6;--mut:#9a9aa5;--ac:#f5c518;--ac2:#1ebe5a}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:480px;padding:20px 16px 40px}
header{text-align:center;padding:8px 0 18px}
.brand{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
h1{font-size:28px;margin:6px 0 4px;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:15px;line-height:1.4}
.bar{height:4px;background:var(--line);border-radius:4px;margin:18px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.step{font-size:12px;color:var(--mut);margin-bottom:14px}
.q{font-size:20px;font-weight:600;margin-bottom:4px;letter-spacing:-.01em}
.hint{font-size:13px;color:var(--mut);margin-bottom:14px;line-height:1.4}
.opts{display:grid;gap:10px}
.opts.g2{grid-template-columns:1fr 1fr}
.opt{background:var(--card);border:1.5px solid var(--line);color:var(--tx);border-radius:14px;padding:15px 14px;font-size:16px;text-align:left;cursor:pointer;font-family:inherit;transition:border-color .15s,transform .05s}
.opt:active{transform:scale(.98)}
.opt:hover{border-color:#44444d}
.opt.sel{border-color:var(--ac);background:#0d1b3a}
.opt small{display:block;color:var(--mut);font-size:12.5px;margin-top:3px;font-weight:400}
.nav{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;text-align:center;text-decoration:none;display:block}
.btn.ghost{background:transparent;color:var(--mut);border:1.5px solid var(--line);flex:0 0 auto;padding:15px 20px}
.btn.wa{background:#25d366;color:#04210f}
.btn.wa:hover{background:var(--ac2)}
.res{text-align:center;background:var(--card);border:1.5px solid #1e4fd8;border-radius:18px;padding:26px 16px;margin-bottom:14px}
.res .lb{font-size:13px;color:var(--mut)}
.res .val{font-size:34px;font-weight:700;margin:8px 0;letter-spacing:-.02em;color:var(--ac)}
.res .md{font-size:15px;font-weight:600}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin-bottom:14px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:14px;border-bottom:1px solid var(--line)}
.sum div:last-child{border:0}
.sum span:first-child{color:var(--mut)}
.sum span:last-child{text-align:right}
.note{font-size:12.5px;color:var(--mut);line-height:1.5;margin:12px 0}
.warn{background:#2a1c10;border:1.5px solid #6b4a1f;border-radius:14px;padding:16px;font-size:15px;line-height:1.5;margin-bottom:14px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">Lustoza Store</div>
  <h1>Avalie seu iPhone</h1>
  <p class="sub">Responda algumas perguntas e veja na hora uma faixa de valor para a sua troca.</p>
</header>
<div class="bar"><i id="pb"></i></div>
<div class="step" id="st"></div>
<main id="m"></main>
<p style="text-align:center;margin-top:28px"><a href="https://lustozastore.com.br/" style="color:var(--mut);font-size:14px">Visitar o site da Lustoza Store</a></p>
</div>
<script>
/* ============ CONFIGURAÇÃO (edite aqui) ============
   WHATSAPP: número com 55 + DDD.
   MODELOS: [nome, valor com bateria 80%+, [armazenamentos], valor com bateria abaixo de 80%]
   Valores = quanto a Lustoza paga (tudo funcionando) no menor armazenamento. null = sempre inconclusivo (vai para o WhatsApp). */
const WHATSAPP="5575991412847";
const STEP_ARMAZ=100; // cada nível de armazenamento acima soma R$ 100
const MODELOS=[
["iPhone 11",400,[64,128,256],400],
["iPhone 11 Pro",500,[64,256,512],500],
["iPhone 11 Pro Max",1100,[64,256,512],1000],
["iPhone 12",800,[64,128,256],800],
["iPhone 12 Pro",1500,[128,256,512],1500],
["iPhone 12 Pro Max",1700,[128,256,512],1700],
["iPhone 13",1000,[128,256,512],1000],
["iPhone 13 Pro",1500,[128,256,512,1024],1500],
["iPhone 13 Pro Max",2000,[128,256,512,1024],2000],
["iPhone 14",1800,[128,256,512],1800],
["iPhone 14 Pro",2000,[128,256,512,1024],2000],
["iPhone 14 Pro Max",2500,[128,256,512,1024],2500],
["iPhone 15",2000,[128,256,512],2000],
["iPhone 15 Pro",2700,[128,256,512,1024],2700],
["iPhone 15 Pro Max",3500,[256,512,1024],3500],
["iPhone 16",3150,[128,256,512],2900],
["iPhone 16 Pro",3500,[128,256,512,1024],3500],
["iPhone 16 Pro Max",4400,[256,512,1024],4400],
["iPhone 17",4500,[256,512],4300],
["iPhone 17 Pro",null,[256,512,1024,2048],null],
["iPhone 17 Pro Max",null,[256,512,1024,2048],null]
];
/* desconto em % do valor: [rótulo, desconto, detalhe] */
const PERGUNTAS=[
{k:"bat",q:"Saúde da bateria",h:"Ajustes › Bateria › Saúde da Bateria",o:[["80% ou mais",0],["Abaixo de 80%",0]]},
{k:"tela",q:"Como está a tela?",o:[["Perfeita, sem riscos",0],["Riscos leves",0],["Riscos fortes",-1],["Trincada ou com mancha",-1]]},
{k:"cas",q:"Como estão as laterais e a traseira?",o:[["Perfeitas",0],["Marcas leves de uso",0],["Amassados ou vidro trincado",-1]]},
{k:"fid",q:"O Face ID funciona?",o:[["Sim",0],["Não",-1]],g2:1},
{k:"cam",q:"As câmeras funcionam bem?",o:[["Sim",0],["Não",-1]],g2:1},
{k:"som",q:"Alto-falantes e microfone funcionam?",o:[["Sim",0],["Não",-1]],g2:1},
{k:"ass",q:"Já passou por assistência técnica?",h:"Troca de tela, bateria fora da Apple ou outro reparo",o:[["Nunca abriu",0],["Já abriu / trocou peça",-1]]},
{k:"cx",q:"Tem caixa e cabo?",o:[["Caixa e cabo",0],["Só o cabo",0],["Só a caixa",0],["Nenhum dos dois",0]]}
];
/* faixa: mínimo e máximo ao redor do valor calculado */
const FAIXA_MIN=1,FAIXA_MAX=1.1,ARREDONDA=50;
/* =================================================== */
const m=document.getElementById("m"),pb=document.getElementById("pb"),st=document.getElementById("st");
const A={};let i=0;
const total=2+PERGUNTAS.length;
const brl=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const gbl=g=>g>=1024?(g/1024)+" TB":g+" GB";
function prog(){pb.style.width=Math.min(100,i/total*100)+"%";st.textContent=i<total?"Pergunta "+(i+1)+" de "+total:""}
function nav(back){return '<div class="nav">'+(back?'<button class="btn ghost" onclick="go(-1)">Voltar</button>':'')+'</div>'}
function go(d){i+=d;render()}
function pick(k,v){A[k]=v;i++;render()}
function render(){
  prog();
  if(i===0){
    m.innerHTML='<div class="q">Qual é o seu iPhone?</div><div class="opts g2">'+MODELOS.map((x,j)=>'<button class="opt'+(A.mod===j?' sel':'')+'" onclick="A.arm=null;pick(\'mod\','+j+')">'+x[0].replace("iPhone ","")+'<small>iPhone</small></button>').join("")+'</div>';
  }else if(i===1){
    const M=MODELOS[A.mod];
    m.innerHTML='<div class="q">Quantos GB?</div><div class="hint">'+M[0]+' · Ajustes › Geral › Sobre › Capacidade</div><div class="opts g2">'+M[2].map((g,j)=>'<button class="opt'+(A.arm===j?' sel':'')+'" onclick="pick(\'arm\','+j+')">'+gbl(g)+'</button>').join("")+'</div>'+nav(1);
  }else if(i<total){
    const P=PERGUNTAS[i-2];
    m.innerHTML='<div class="q">'+P.q+'</div>'+(P.h?'<div class="hint">'+P.h+'</div>':'<div class="hint"></div>')+'<div class="opts'+(P.g2?' g2':'')+'">'+P.o.map((o,j)=>'<button class="opt'+(A[P.k]===j?' sel':'')+'" onclick="pick(\''+P.k+'\','+j+')">'+o[0]+'</button>').join("")+'</div>'+nav(1);
  }else result();
  window.scrollTo(0,0);
}
function wa(txt){return "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(txt)}
function result(){
  pb.style.width="100%";
  const M=MODELOS[A.mod],g=M[2][A.arm];
  const linhas=[["Modelo",M[0]],["Armazenamento",gbl(g)]];
  let bloqueio=false,desc=0;
  PERGUNTAS.forEach(P=>{const o=P.o[A[P.k]];linhas.push([P.q,o[0]]);if(o[1]<0)bloqueio=true;else desc+=o[1]});
  const sum='<div class="sum">'+linhas.map(l=>'<div><span>'+l[0]+'</span><span>'+l[1]+'</span></div>').join("")+'</div>';
  if(M[1]==null)bloqueio=true;
  const base=(A.bat===0?M[1]:M[3])+STEP_ARMAZ*A.arm;
  const v=base*Math.max(0,1-desc);
  const r=x=>Math.round(x/ARREDONDA)*ARREDONDA;
  const lo=r(v*FAIXA_MIN),hi=r(v*FAIXA_MAX);
  const resumo=linhas.map(l=>"• "+l[0]+": "+l[1]).join("\n");
  let html;
  if(bloqueio){
    html='<div class="warn"><b>Precisamos ver o seu aparelho.</b><br>Com essas informações não dá para fechar um valor por aqui. Chame a gente no WhatsApp que avaliamos com você.</div>'+sum+
    '<a class="btn wa" target="_blank" rel="noopener" href="'+wa("Olá! Quero avaliar meu iPhone para troca.\n\n"+resumo+"\n\nPreciso que vocês vejam o aparelho.")+'">Chamar no WhatsApp</a>';
  }else{
    html='<div class="res"><div class="lb">Seu '+M[0]+' '+gbl(g)+' vale entre</div><div class="val">'+brl(lo)+' a '+brl(hi)+'</div><div class="md">na troca por outro aparelho</div></div>'+sum+
    '<a class="btn wa" target="_blank" rel="noopener" href="'+wa("Olá! Avaliei meu iPhone no site da Lustoza Store e quero fazer a troca.\n\nFaixa estimada: "+brl(lo)+" a "+brl(hi)+"\n\n"+resumo+"\n\nPode confirmar o valor?")+'">Confirmar valor no WhatsApp</a>'+
    '<p class="note">Valor estimado. O valor final depende da veracidade das informações e da conferência técnica do aparelho na loja.</p>';
  }
  html+='<div class="nav"><button class="btn ghost" style="flex:1" onclick="i=0;render()">Avaliar outro iPhone</button></div>';
  m.innerHTML=html;st.textContent="";window.scrollTo(0,0);
}
render();
</script>
</body>
</html>
